name: Build Windows exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name ClipPoster --add-data "static;static" --collect-submodules uvicorn --collect-data googleapiclient --hidden-import multipart main.py
      - uses: actions/upload-artifact@v4
        with: { name: ClipPoster, path: dist/ClipPoster.exe }

